<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthLens Context Auditor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo-row">
      <span class="logo-icon">🔍</span>
      <h1 class="logo-title">TruthLens</h1>
      <span class="badge">Context Auditor</span>
    </div>
    <p class="tagline">Reddit consensus &bull; Fact-checks &bull; SHAP attribution</p>
  </div>

  <div class="input-area">
    <textarea id="claimInput" placeholder="Paste claim or highlight text on any page..." rows="3"></textarea>
    <button id="verifyBtn" class="primary-btn">
      <span id="btnText">Verify Claim & Gather Context</span>
      <div id="btnSpinner" class="spinner hidden"></div>
    </button>
  </div>

  <div id="results" class="results hidden">
    <!-- Verdict Banner -->
    <div id="verdictCard" class="verdict-card">
      <div class="verdict-top">
        <span id="verdictBadge" class="verdict-badge"></span>
        <span id="confidenceScore" class="confidence-score"></span>
      </div>
      <p id="verdictSummary" class="verdict-summary"></p>
    </div>

    <!-- Temporal Anomaly Alert -->
    <div id="temporalAlert" class="temporal-alert hidden"></div>

    <!-- Cognitive & Rhetorical Manipulation -->
    <div class="section">
      <div class="section-header">
        <h3 class="section-title">🧠 Cognitive Vulnerability Audit</h3>
        <span id="riskBadge" class="risk-badge"></span>
      </div>
      <div id="rhetoricChips" class="rhetoric-chips"></div>
    </div>

    <!-- SHAP Linguistic Attribution -->
    <div class="section">
      <h3 class="section-title">🔬 SHAP Linguistic Attribution</h3>
      <div id="shapBars" class="shap-bars"></div>
    </div>

    <!-- Reddit Consensus -->
    <div class="section">
      <h3 class="section-title">💬 Reddit Community Stance</h3>
      <div id="redditList" class="reddit-list"></div>
    </div>

    <!-- Fact Check Database -->
    <div class="section">
      <h3 class="section-title">🏛️ Fact-Checking Matches</h3>
      <div id="factCheckList" class="factcheck-list"></div>
    </div>
  </div>

  <div id="errorBox" class="error-box hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
